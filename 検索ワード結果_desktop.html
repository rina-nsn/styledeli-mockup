<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1240">
<title>STYLE DELI – 検索結果ページ（デスクトップ）</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700&family=Italiana&family=Tenor+Sans&display=swap" rel="stylesheet">
<style>
:root{
  --color-ink:#2a2a2a; --color-label:#5a5a52; --color-ink-secondary:#7a7570; --color-caption:#8a8580; --color-ink-muted:#9a9490; --color-ink-tertiary:#bbb; --color-border:#ddd;
  --color-bg:#faf9f7; --color-panel:#f5f2ec; --color-hairline:#ece9e4; --color-hairline-2:#e4dfd8;
  --color-ph-1:#e5e0d6; --color-ph-ink:#b9b1a4; --color-gold:#b98f40;
  --color-sale:#8a3030; --color-sale-bg:#f5e8e8; --color-sale-border:#d8a0a0;
  --color-point:#8a6030; --color-point-bg:#f5ede0; --color-point-border:#d8c090;
  --color-preorder:#4a5870; --color-preorder-bg:#eceef3; --color-preorder-border:#b8c0d0;
  --color-neutral-bg:#f0f0ee; --color-neutral-border:#c8c4b8;
  --font-body:'Zen Kaku Gothic New','Hiragino Kaku Gothic ProN','Yu Gothic',sans-serif;
  --font-serif-en:'Italiana','Times New Roman',serif;
  --font-logo:'Tenor Sans',sans-serif;
  --tracking-eyebrow:.18em;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--font-body);background:#e8e5e0;padding:32px 24px;display:flex;flex-direction:column;align-items:center;gap:36px;color:var(--color-ink)}
.doc{font-size:16px;letter-spacing:.1em;color:#777;font-weight:500;text-align:center}
p.sub{font-size:10px;color:#bbb;letter-spacing:.06em;text-align:center}
.frame-label{font-size:11px;font-weight:500;letter-spacing:.12em;color:#555;text-align:center;margin-bottom:10px}
.desktop{width:1120px;max-width:100%;height:660px;background:var(--color-bg);border:1px solid #c8c4be;border-radius:10px;overflow-y:auto;overflow-x:hidden;box-shadow:0 8px 32px rgba(0,0,0,.12);scrollbar-width:none}
.desktop::-webkit-scrollbar{display:none}

/* 確定ヘッダー */
.announce{display:flex;align-items:center;justify-content:center;gap:10px;background:var(--color-ink);color:#f3efe9;font-size:10px;letter-spacing:.08em;padding:8px 12px}
.announce .cta{color:var(--color-gold);letter-spacing:.1em}
.hdr{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:0 36px;height:64px;border-bottom:1px solid var(--color-hairline)}
.hdr-search{display:flex;align-items:center;gap:8px;color:var(--color-ink);font-size:11px;border-bottom:0.5px solid #c9c3ba;padding:6px 2px;max-width:200px}
.hdr-search .q{flex:1}
.hdr-search .clr{color:var(--color-ink-muted);font-size:13px}
.hdr-logo{font-family:var(--font-logo);font-size:18px;letter-spacing:.42em;text-align:center;padding-left:.42em}
.hdr-icons{display:flex;gap:18px;justify-self:end;color:var(--color-ink)}
.hdr-nav{display:flex;justify-content:center;gap:22px;padding:13px 0;border-bottom:1px solid var(--color-hairline)}
.hdr-nav a{font-family:var(--font-body);font-size:13px;letter-spacing:.08em;color:var(--color-ink);text-decoration:none;white-space:nowrap}
.hdr-nav a svg{margin-left:5px;opacity:.5;vertical-align:middle}
.hdr-nav a.outlet{color:var(--color-gold)}

/* 検索サマリ バー */
.sr-bar{display:flex;align-items:center;justify-content:space-between;padding:22px 36px 16px}
.sr-summary{font-size:14px;color:var(--color-ink)}
.sr-summary b{font-weight:500}
.sr-summary .cnt{font-size:11px;color:var(--color-ink-tertiary);letter-spacing:.08em;margin-left:10px}
.sr-tools{display:flex;align-items:center;gap:20px}
.sr-sort{display:flex;align-items:center;gap:6px;font-size:11px;letter-spacing:.06em;color:var(--color-ink)}
.sr-filter{display:flex;align-items:center;gap:7px;font-size:11px;letter-spacing:.08em;color:var(--color-ink);border:1px solid var(--color-hairline-2);padding:8px 16px;cursor:pointer}

/* グリッド4列 */
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:22px 20px;padding:6px 36px 10px}
.prod-img-wrap{position:relative;width:100%;aspect-ratio:4/5;background:var(--color-ph-1);overflow:hidden;margin-bottom:9px}
.prod-img-ph{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:8px;color:var(--color-ph-ink)}
.prod-badges{position:absolute;top:9px;left:9px;display:flex;flex-direction:column;gap:4px}
.badge{font-size:8px;letter-spacing:.1em;padding:3px 6px;line-height:1.4}
.badge-point{background:var(--color-point-bg);color:var(--color-point);border:0.5px solid var(--color-point-border)}
.badge-sale{background:var(--color-sale-bg);color:var(--color-sale);border:0.5px solid var(--color-sale-border)}
.badge-pre{background:var(--color-preorder-bg);color:var(--color-preorder);border:0.5px solid var(--color-preorder-border)}
.badge-rear{background:var(--color-neutral-bg);color:var(--color-ink-secondary);border:0.5px solid var(--color-neutral-border)}
.prod-heart{position:absolute;top:9px;right:9px;width:28px;height:28px;background:rgba(250,249,247,.85);display:flex;align-items:center;justify-content:center;border-radius:50%}
.prod-colors{display:flex;gap:5px;align-items:center;margin-bottom:6px}
.color-chip{width:12px;height:12px;border-radius:50%;border:0.5px solid rgba(0,0,0,.08)}
.color-chip.active{outline:1.5px solid var(--color-ink);outline-offset:1.5px}
.color-more{font-size:9px;color:var(--color-ink-tertiary)}
.prod-name{font-size:12.5px;color:var(--color-ink);line-height:1.55;margin-bottom:5px}
.prod-price-row{display:flex;align-items:baseline;gap:6px;flex-wrap:wrap}
.prod-price{font-size:13px;color:var(--color-ink)}
.prod-price-tax{font-size:9px;color:var(--color-ink-tertiary)}
.prod-price-orig{font-size:10px;color:var(--color-ink-tertiary);text-decoration:line-through}
.prod-price-sale{font-size:13px;font-weight:500;color:var(--color-sale)}

/* pager */
.pager{display:flex;align-items:center;justify-content:center;gap:5px;padding:26px}
.page-btn{width:34px;height:34px;display:flex;align-items:center;justify-content:center;font-size:11px;color:var(--color-ink);border:0.5px solid transparent;cursor:pointer}
.page-btn.active{border-color:var(--color-ink);background:var(--color-ink);color:var(--color-bg)}
.page-btn.arr{color:var(--color-ink-muted);font-size:16px}

/* 0件 */
.nr{padding:64px 36px 30px;text-align:center}
.nr .ic{color:var(--color-ink-tertiary);margin-bottom:20px}
.nr .msg{font-size:15px;color:var(--color-ink);line-height:1.7;margin-bottom:8px}
.nr .msg b{font-weight:500}
.nr .hint{font-size:11px;color:var(--color-ink-muted);line-height:1.7}
.nr-h{font-family:var(--font-serif-en);font-size:14px;letter-spacing:var(--tracking-eyebrow);color:var(--color-caption);display:flex;align-items:center;gap:14px;padding:0 36px;margin:18px 0 16px;text-transform:uppercase}
.nr-h::before,.nr-h::after{content:'';flex:1;height:1px;background:var(--color-hairline-2)}
.chips{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;padding:0 36px 8px}
.chip{font-size:12px;letter-spacing:.04em;color:var(--color-ink);border:0.5px solid var(--color-hairline-2);padding:9px 20px;cursor:pointer}
</style>
</head>
<body>

<div class="doc">STYLE DELI — 検索結果ページ（デスクトップ）</div>
<p class="sub">確定デスクトップヘッダー（ITEMナビ）＋確定トークン / 結果あり・0件</p>

<div id="root"></div>

<script>
const ic=(p)=>`<svg width="18" height="18" viewBox="0 0 19 19" fill="none" stroke="#2a2a2a" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round">${p}</svg>`;
const navItems=['ITEM','STYLE DELI','DELI by STYLE DELI','BLK001','MARJOUR','STYLING','OUTLET'];
const hasDD=['ITEM','STYLE DELI','STYLING'];
const chevDown='<svg width="9" height="9" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M2 4l4 4 4-4"/></svg>';
const heart='<div class="prod-heart"><svg width="13" height="13" viewBox="0 0 12 12" fill="none" stroke="#2a2a2a" stroke-width="1"><path d="M6 10.5s-5-3.2-5-6.5A2.7 2.7 0 0 1 6 2 2.7 2.7 0 0 1 11 4C11 7.3 6 10.5 6 10.5z"/></svg></div>';
const mag='<svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="0.9"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.5-4.5"/></svg>';

function header(query){
  const nav=navItems.map(en=>`<a href="#" class="${en==='OUTLET'?'outlet':''}">${en}${hasDD.includes(en)?chevDown:''}</a>`).join('');
  return `
   <div class="announce"><span>新作＆ピックアップ商品 24時間ポイントアップ開催中</span><span style="color:var(--color-gold);opacity:.6">●</span><span>¥15,000以上で送料無料</span><span class="cta">詳細 ›</span></div>
   <div class="hdr">
     <div class="hdr-search">${ic('<circle cx="8" cy="8" r="5.2"/><line x1="12" y1="12" x2="17" y2="17"/>')}<span class="q">${query}</span><span class="clr">×</span></div>
     <div class="hdr-logo">STYLE DELI</div>
     <div class="hdr-icons">${ic('<circle cx="9.5" cy="5.5" r="2.6"/><path d="M3.5 16c0-3.3 2.7-5.5 6-5.5s6 2.2 6 5.5"/>')}${ic('<path d="M9.5 16.5S3 12.5 3 8a3.3 3.3 0 0 1 6.5-1A3.3 3.3 0 0 1 16 8c0 4.5-6.5 8.5-6.5 8.5z"/>')}${ic('<path d="M4 4h12l-1.5 9h-9L4 4z"/><circle cx="8" cy="16.5" r="1"/><circle cx="13.5" cy="16.5" r="1"/>')}</div>
   </div>
   <nav class="hdr-nav">${nav}</nav>`;
}

const srBar=`<div class="sr-bar">
  <div class="sr-summary"><b>「ワイドパンツ」</b>の検索結果<span class="cnt">全23点</span></div>
  <div class="sr-tools">
    <div class="sr-sort">関連度順 <svg width="9" height="9" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M2 4l4 4 4-4"/></svg></div>
    <div class="sr-filter"><svg width="12" height="12" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1"><line x1="1" y1="3" x2="11" y2="3"/><line x1="3" y1="6" x2="9" y2="6"/><line x1="5" y1="9" x2="7" y2="9"/></svg>絞り込み</div>
  </div>
</div>`;

const prods=[
 {b:[['point','POINT 10x']],c:['#d4cec8','#2a2a2a','#8a9a8a'],more:'+1',n:'プリーツワイドパンツ',p:'<span class="prod-price">¥14,500</span><span class="prod-price-tax">税込</span>'},
 {b:[['sale','SALE']],c:['#c8b4a0','#2a2a2a'],n:'リネンブレンドワイドパンツ',p:'<span class="prod-price-orig">¥12,800</span><span class="prod-price-sale">¥9,600</span>'},
 {b:[['rear','BACK IN STOCK']],c:['#8a9a8a','#d4cec8'],n:'タックワイドパンツ',p:'<span class="prod-price">¥13,200</span><span class="prod-price-tax">税込</span>'},
 {b:[],c:['#2a2a2a'],n:'ストレッチワイドパンツ',p:'<span class="prod-price">¥11,900</span><span class="prod-price-tax">税込</span>'},
 {b:[['pre','予約']],c:['#d4cec8','#8a9a8a','#c8b4a0'],n:'ウールブレンドワイドパンツ',p:'<span class="prod-price">¥16,500</span><span class="prod-price-tax">税込</span>'},
 {b:[['point','POINT 10x']],c:['#c8b4a0'],n:'イージーワイドパンツ',p:'<span class="prod-price">¥9,800</span><span class="prod-price-tax">税込</span>'},
 {b:[['sale','SALE']],c:['#2a2a2a','#d4cec8'],n:'センタープレスワイドパンツ',p:'<span class="prod-price-orig">¥15,400</span><span class="prod-price-sale">¥10,800</span>'},
 {b:[],c:['#8a9a8a','#c8b4a0','#2a2a2a'],more:'+2',n:'コットンリネンワイドパンツ',p:'<span class="prod-price">¥12,500</span><span class="prod-price-tax">税込</span>'},
];
const cell=(pr)=>`<div><div class="prod-img-wrap"><div class="prod-img-ph">4:5</div>${pr.b.length?`<div class="prod-badges">${pr.b.map(([k,t])=>`<span class="badge badge-${k}">${t}</span>`).join('')}</div>`:''}${heart}</div><div class="prod-colors">${pr.c.map((h,i)=>`<div class="color-chip${i===0?' active':''}" style="background:${h}"></div>`).join('')}${pr.more?`<span class="color-more">${pr.more}</span>`:''}</div><div class="prod-name">${pr.n}</div><div class="prod-price-row">${pr.p}</div></div>`;

const pager=`<div class="pager"><div class="page-btn arr">‹</div><div class="page-btn active">1</div><div class="page-btn">2</div><div class="page-btn">3</div><div class="page-btn arr">›</div></div>`;

const resultsFrame=`<div class="desktop">${header('ワイドパンツ')}${srBar}<div class="grid4">${prods.map(cell).join('')}</div>${pager}</div>`;

const popular=prods.slice(0,4).map(cell).join('');
const zeroFrame=`<div class="desktop">${header('わいどぱんつ メンズ')}
  <div class="sr-bar"><div class="sr-summary"><b>「わいどぱんつ メンズ」</b>の検索結果<span class="cnt">全0点</span></div></div>
  <div class="nr">
    <div class="ic">${mag}</div>
    <div class="msg"><b>「わいどぱんつ メンズ」</b>に一致する商品は見つかりませんでした</div>
    <div class="hint">キーワードを変える・短くする、表記をひらがな／カタカナにすると見つかりやすくなります</div>
  </div>
  <div class="nr-h">人気のカテゴリーから探す</div>
  <div class="chips"><span class="chip">ワイドパンツ</span><span class="chip">ワンピース</span><span class="chip">トップス</span><span class="chip">スカート</span><span class="chip">アウター</span><span class="chip">新着アイテム</span></div>
  <div class="nr-h">人気アイテム</div>
  <div class="grid4">${popular}</div>
</div>`;

document.getElementById('root').innerHTML=`
  <div style="display:flex;flex-direction:column;align-items:center;gap:36px">
    <div><div class="frame-label">検索結果（あり）</div>${resultsFrame}</div>
    <div><div class="frame-label">検索結果（0件）</div>${zeroFrame}</div>
  </div>`;
</script>

</body>
</html>
