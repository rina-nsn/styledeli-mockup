<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=900">
<title>STYLE DELI – 絞り込みモーダル（実装スコープ版）</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root{
  --font-sans:'Zen Kaku Gothic New', sans-serif;
  --fs-group:11px; --fs-opt:12px; --tk-group:.14em; --tk-eyebrow:.28em;
  --bg:#faf9f7; --ink:#2a2a2a; --ink-soft:#6a6a62; --line:#ece9e4; --line-soft:#f0ede8;
  --ph:#e4dfd8; --muted:#bbb; --muted-2:#aaa;
  --color-point-bg:#faf9f7; --color-point-border:#c8a870; --color-point-strong:#8a6a30;
  --color-sale:#8a3030; --color-sale-line:#c8a0a0;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--font-sans);background:#e8e5e0;padding:32px 24px;display:flex;flex-direction:column;align-items:center;gap:32px;color:var(--ink)}
.doc{font-size:16px;letter-spacing:.1em;color:#777;font-weight:500;text-align:center}
p.sub{font-size:10px;color:#bbb;letter-spacing:.06em;text-align:center}
.row{display:flex;gap:28px;align-items:flex-start;flex-wrap:wrap;justify-content:center}
.col-label{font-size:11px;font-weight:500;letter-spacing:.12em;color:#555;text-align:center;margin-bottom:10px}
.phone{width:375px;height:760px;overflow:hidden;border-radius:14px;border:1px solid #c8c4be;box-shadow:0 8px 32px rgba(0,0,0,.12);background:rgba(42,42,42,.28);position:relative}

/* ── モーダル（ボトムシート） ── */
.sheet{position:absolute;left:0;right:0;bottom:0;top:36px;background:var(--bg);border-radius:16px 16px 0 0;display:flex;flex-direction:column;box-shadow:0 -8px 30px rgba(0,0,0,.12)}
.sheet-grab{width:36px;height:4px;border-radius:2px;background:#d9d4cc;margin:8px auto 0}
.sheet-head{display:flex;align-items:center;justify-content:space-between;padding:10px 18px 12px;border-bottom:1px solid var(--line)}
.sheet-title{font-size:13px;font-weight:500;letter-spacing:.16em}
.sheet-x{font-size:18px;color:var(--muted-2);font-weight:300;line-height:1}
.sheet-body{flex:1;overflow-y:auto;padding:4px 0 0}
.sheet-body::-webkit-scrollbar{width:0}

/* セクション共通 */
.sec{border-bottom:1px solid var(--line-soft);padding:14px 18px}
.sec-label{font-size:var(--fs-group);font-weight:500;letter-spacing:var(--tk-group);color:var(--ink);margin-bottom:11px}

/* アコーディオン見出し */
.acc{border-bottom:1px solid var(--line-soft)}
.acc-head{display:flex;align-items:center;justify-content:space-between;padding:15px 18px;cursor:pointer}
.acc-title{font-size:var(--fs-group);font-weight:500;letter-spacing:var(--tk-group);color:var(--ink);display:flex;align-items:baseline;gap:8px}
.acc-sel{font-size:10px;color:var(--ink-soft);font-weight:400;letter-spacing:.04em}
.acc-chev{font-size:11px;color:var(--muted-2)}
.acc-body{padding:0 18px 16px}

/* 人気キーワード チップ */
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{font-size:10px;letter-spacing:.06em;color:var(--ink);border:0.5px solid #d6d1c8;border-radius:2px;padding:6px 11px;background:#fff}

/* 在庫トグル */
.toggle-row{display:flex;align-items:center;justify-content:space-between}
.toggle-txt{font-size:var(--fs-opt);color:var(--ink)}
.toggle-txt span{color:var(--muted-2);font-size:10px}
.switch{width:36px;height:20px;border-radius:10px;background:#dcd7cf;position:relative;flex-shrink:0;transition:.2s}
.switch.on{background:var(--ink)}
.switch::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:#fff;transition:.2s}
.switch.on::after{left:18px}

/* チェックボックス行 */
.check-row{display:flex;align-items:center;gap:10px;padding:8px 0;cursor:pointer}
.check{width:15px;height:15px;border:1px solid #c4bfb6;border-radius:2px;flex-shrink:0;position:relative}
.check.on{background:var(--ink);border-color:var(--ink)}
.check.on::after{content:"";position:absolute;left:4.5px;top:1px;width:4px;height:8px;border:solid #fff;border-width:0 1.5px 1.5px 0;transform:rotate(45deg)}
.check-label{font-size:var(--fs-opt);color:var(--ink)}
.check-label span{color:var(--muted-2);font-size:10px;margin-left:3px}

/* カテゴリ ドリルダウン */
.cat-row{display:flex;align-items:center;justify-content:space-between;padding:11px 0;cursor:pointer;border-bottom:1px solid var(--line-soft)}
.cat-row:last-child{border-bottom:none}
.cat-l{font-size:var(--fs-opt);color:var(--ink)}
.cat-r{font-size:10px;color:var(--muted-2);display:flex;align-items:center;gap:6px}

/* カラー */
.sw-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px 8px}
.sw{display:flex;flex-direction:column;align-items:center;gap:5px;cursor:pointer}
.sw-dot{width:30px;height:30px;border-radius:50%;border:0.5px solid rgba(0,0,0,.1)}
.sw.active .sw-dot{outline:1.5px solid var(--ink);outline-offset:2px}
.sw-name{font-size:9px;color:var(--ink-soft);letter-spacing:.02em}
.sw.disabled{opacity:.35}
.sw.disabled .sw-name{color:var(--muted-2)}
.sw-note{font-size:9px;color:var(--muted-2);margin-top:9px;letter-spacing:.04em}

/* サイズ */
.size-grid{display:flex;flex-wrap:wrap;gap:8px}
.size{min-width:42px;text-align:center;font-size:11px;color:var(--ink);border:0.5px solid #d6d1c8;padding:8px 6px;cursor:pointer}
.size.active{background:var(--ink);color:var(--bg);border-color:var(--ink)}

/* 価格 */
.price-row{display:flex;align-items:center;gap:10px}
.price-in{flex:1;border:0.5px solid #d6d1c8;padding:9px 10px;font-size:11px;color:var(--ink-soft);background:#fff}
.price-sep{color:var(--muted-2)}

/* フッター */
.sheet-foot{display:flex;align-items:center;gap:14px;padding:12px 18px;border-top:1px solid var(--line);background:var(--bg)}
.reset{font-size:11px;color:var(--ink-soft);letter-spacing:.06em;border-bottom:1px solid #ddd;padding-bottom:1px;white-space:nowrap}
.apply{flex:1;background:var(--ink);color:var(--bg);text-align:center;padding:13px;font-size:12px;letter-spacing:.14em;font-weight:500}
</style>
</head>
<body>

<div class="doc">STYLE DELI — 絞り込みモーダル（実装スコープ版）</div>
<p class="sub">375px / S&D標準＋テーマで完結する範囲（カテゴリ＝フラット・›ドリルなし）</p>

<div class="row" id="row"></div>

<script>
const colors = [
  ['ホワイト','#f3f1ee'],['グレー','#b8b4ad'],['ブラック','#2a2a2a'],['ブラウン','#6b4f3a'],
  ['ベージュ','#cbb89d'],['グリーン','#7c8a6f'],['ブルー','#5a6b86'],['パープル','#7a6a86'],
  ['イエロー','#d8c87a'],['ピンク','#d8a9aa'],['レッド','#9a3b3b'],['シルバー','#c3c3c3']
];
const sizes = ['FREE','XS','S','M','L','LL','01','02','03'];
const brands = [['BLK001',18],['marjour',24],['DELI by',12],['DRESSDEN',7]];
const cats = [['トップス',24],['ワンピース',18],['ボトムス',12],['セットアップ',6],['アウター',5],['バッグ・アクセサリー',8]];
const care = [['洗濯機で洗える',38],['手洗い可',18],['ドライクリーニングのみ',6]];
const keywords = ['体型カバー','洗える','セットアップ','送料無料','メイドインジャパン','大人カジュアル'];

function swGrid(sel){ // sel = {active:[], disabled:[]}
  return `<div class="sw-grid">${colors.map(([n,h])=>{
    const cls = (sel.active||[]).includes(n) ? ' active' : (sel.disabled||[]).includes(n) ? ' disabled' : '';
    return `<div class="sw${cls}"><div class="sw-dot" style="background:${h}"></div><div class="sw-name">${n}</div></div>`;
  }).join('')}</div>${sel.disabled&&sel.disabled.length?`<div class="sw-note">${sel.disabled[0]}は在庫なし</div>`:''}`;
}
function sizeGrid(active){
  return `<div class="size-grid">${sizes.map(s=>`<div class="size${active===s?' active':''}">${s}</div>`).join('')}</div>`;
}
function accHead(title, sel, open){
  return `<div class="acc-head"><div class="acc-title">${title}${sel?`<span class="acc-sel">${sel}</span>`:''}</div><div class="acc-chev">${open?'∧':'∨'}</div></div>`;
}

function modal(state){
  const brandBody = `<div class="acc-body">${brands.map(([n,c])=>`<div class="check-row"><div class="check"></div><div class="check-label">${n}<span>(${c})</span></div></div>`).join('')}</div>`;
  const catBody = `<div class="acc-body">${cats.map(([n,c])=>`<div class="check-row"><div class="check"></div><div class="check-label">${n}<span>(${c})</span></div></div>`).join('')}</div>`;
  const careBody = `<div class="acc-body">${care.map(([n,c])=>`<div class="check-row"><div class="check"></div><div class="check-label">${n}<span>(${c})</span></div></div>`).join('')}</div>`;
  const priceBody = `<div class="acc-body"><div class="price-row"><div class="price-in">¥ min</div><span class="price-sep">〜</span><div class="price-in">¥ max</div></div></div>`;

  return `
  <div class="phone">
    <div class="sheet">
      <div class="sheet-grab"></div>
      <div class="sheet-head"><div class="sheet-title">絞り込み</div><div class="sheet-x">×</div></div>
      <div class="sheet-body">

        <div class="sec">
          <div class="sec-label">人気キーワード</div>
          <div class="chips">${keywords.map(k=>`<div class="chip">${k}</div>`).join('')}</div>
        </div>

        <div class="sec">
          <div class="toggle-row"><div class="toggle-txt">在庫ありのみ表示 <span>(42)</span></div><div class="switch${state.inStock?' on':''}"></div></div>
        </div>

        <div class="acc">${accHead('ブランド','',state.open.brand)}${state.open.brand?brandBody:''}</div>
        <div class="acc">${accHead('カテゴリ','',state.open.cat)}${state.open.cat?catBody:''}</div>
        <div class="acc">${accHead('カラー',state.color?state.color:'',state.open.color)}${state.open.color?`<div class="acc-body">${swGrid(state.sw||{})}</div>`:''}</div>
        <div class="acc">${accHead('サイズ',state.size?state.size:'',state.open.size)}${state.open.size?`<div class="acc-body">${sizeGrid(state.size)}</div>`:''}</div>
        <div class="acc">${accHead('お手入れ','',state.open.care)}${state.open.care?careBody:''}</div>
        <div class="acc">${accHead('価格（税込）','',state.open.price)}${state.open.price?priceBody:''}</div>

      </div>
      <div class="sheet-foot"><div class="reset">リセット</div><div class="apply">${state.count}件を表示</div></div>
    </div>
  </div>`;
}

const initial = {
  inStock:false, count:61,
  open:{brand:true,cat:true,color:true,size:true,care:true,price:true},
  sw:{}, size:null, color:null
};
const selected = {
  inStock:true, count:14, color:'ブラック', size:'02',
  open:{brand:false,cat:false,color:true,size:true,care:false,price:false},
  sw:{active:['ブラック'], disabled:['グレー']}
};

document.getElementById('row').innerHTML = `
  <div><div class="col-label">初期状態（絞り込みなし）</div>${modal(initial)}</div>
  <div><div class="col-label">選択後（ブラック・02・在庫あり）</div>${modal(selected)}</div>
`;
</script>

</body>
</html>
