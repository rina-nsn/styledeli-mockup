<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=900">
<title>STYLE DELI – モバイルヘッダー＆メニュー（確定版）</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700&family=Cormorant+Garamond:wght@500;600&family=Tenor+Sans&display=swap" rel="stylesheet">
<style>
:root{
  --color-ink:#2a2a2a; --color-label:#5a5a52; --color-ink-secondary:#7a7570; --color-caption:#8a8580; --color-ink-tertiary:#aaa;
  --color-bg:#faf9f7; --color-hairline:#ece9e4; --color-hairline-2:#e4dfd8; --color-ph-1:#e5e0d6; --color-gold:#b98f40;
  --font-body:'Zen Kaku Gothic New','Hiragino Kaku Gothic ProN','Yu Gothic',sans-serif;
  --font-serif-en:'Cormorant Garamond','Times New Roman',serif;
  --font-logo:'Tenor Sans',sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--font-body);background:#e8e5e0;padding:32px 24px;display:flex;flex-direction:column;align-items:center;gap:30px;color:var(--color-ink)}
.doc{font-size:16px;letter-spacing:.1em;color:#777;font-weight:500;text-align:center}
p.sub{font-size:10px;color:#bbb;letter-spacing:.06em;text-align:center}
.row{display:flex;gap:28px;flex-wrap:wrap;justify-content:center;align-items:flex-start}
.col-label{font-size:11px;font-weight:500;letter-spacing:.12em;color:#555;text-align:center;margin-bottom:10px}
.phone{width:375px;height:720px;border-radius:14px;border:1px solid #c8c4be;box-shadow:0 8px 32px rgba(0,0,0,.12);overflow:hidden;position:relative;background:var(--color-bg)}

/* ===== 確定共通ヘッダー ===== */
.m-anno{background:var(--color-ink);color:#f3efe9;font-size:9px;letter-spacing:.08em;padding:7px 14px;display:flex;align-items:center;justify-content:center;gap:10px}
.m-anno .cta{color:var(--color-gold);letter-spacing:.1em;white-space:nowrap}
.m-head{height:54px;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:0 14px;border-bottom:1px solid var(--color-hairline)}
.m-burger{justify-self:start;cursor:pointer;color:var(--color-ink)}
.m-logo{justify-self:center;font-family:var(--font-logo);font-weight:400;font-size:15px;letter-spacing:.34em;padding-left:.34em;white-space:nowrap;color:var(--color-ink)}
.m-head-ic{display:flex;gap:14px;justify-self:end;align-items:center;color:var(--color-ink)}
.m-ic{position:relative;cursor:pointer}
.m-ic .badge{position:absolute;top:-4px;right:-5px;background:var(--color-ink);color:var(--color-bg);font-size:7px;width:12px;height:12px;border-radius:50%;display:flex;align-items:center;justify-content:center}

/* ページ hint（ヘッダー単体表示用） */
.pghint{padding:18px 16px;opacity:.6}
.pghint .h{text-align:center;font-size:14px;letter-spacing:.16em;font-weight:500;margin-bottom:14px}
.pghint .g{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pghint .g div{height:150px;background:var(--color-ph-1)}

/* ===== 確定ドロワー ===== */
.scrim{position:absolute;inset:0;background:rgba(0,0,0,.35);z-index:8}
.drawer{position:absolute;inset:0;background:var(--color-bg);overflow-y:auto;z-index:9}
.drawer::-webkit-scrollbar{width:0}
.dr-head{height:54px;display:flex;align-items:center;justify-content:space-between;padding:0 16px;border-bottom:1px solid var(--color-hairline)}
.dr-head .t{font-family:var(--font-serif-en);font-size:12px;letter-spacing:.2em;color:var(--color-caption)}
.dr-close{cursor:pointer;color:var(--color-ink)}
.dr-group-h{font-size:10.5px;font-weight:500;letter-spacing:.18em;color:var(--color-caption);padding:20px 18px 10px;display:flex;align-items:center;gap:10px}
.dr-group-h::after{content:'';flex:1;height:1px;background:var(--color-hairline-2)}
.dr-arrivals{display:grid;grid-template-columns:repeat(3,1fr);border-top:1px solid var(--color-hairline);border-bottom:1px solid var(--color-hairline)}
.a-cell{display:flex;flex-direction:column;align-items:center;gap:3px;padding:14px 4px;cursor:pointer;border-right:1px solid var(--color-hairline)}
.a-cell:last-child{border-right:none}
.a-cell .en{font-family:var(--font-serif-en);font-size:12px;letter-spacing:.12em;color:var(--color-ink)}
.a-cell .jp{font-size:10px;color:var(--color-ink-secondary)}
.dr-nav .di{display:flex;justify-content:space-between;align-items:center;padding:16px 18px;border-bottom:1px solid var(--color-hairline);cursor:pointer}
.dr-nav .di .en{font-family:var(--font-serif-en);font-size:14px;letter-spacing:.14em;color:var(--color-ink)}
.dr-nav .di .chev{width:12px;height:12px;opacity:.55}
.dr-nav .di.outlet .en{color:var(--color-gold)}
.dr-nav .di .jp-tag{font-size:10px;letter-spacing:.08em;color:var(--color-caption);margin-left:10px}
.dr-styling{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:6px 18px 18px}
.st-card{cursor:pointer}
.st-card .thumb{aspect-ratio:4/5;background:repeating-linear-gradient(135deg,#efe9e1,#efe9e1 12px,#e9e2d8 12px,#e9e2d8 24px);border-radius:3px;display:flex;align-items:flex-end;padding:10px;color:var(--color-caption);font-size:8px;letter-spacing:.1em}
.st-card .en{display:block;font-family:var(--font-serif-en);font-size:12px;letter-spacing:.14em;color:var(--color-ink);margin-top:9px}
.st-card .jp{display:block;font-size:9.5px;color:var(--color-ink-secondary);margin-top:2px}
.dr-util{padding:8px 18px 14px;display:flex;flex-direction:column;gap:2px;border-top:1px solid var(--color-hairline)}
.dr-util a{display:flex;align-items:center;gap:9px;font-size:12px;color:var(--color-label);padding:9px 0;cursor:pointer}
.dr-foot{padding:16px 18px;display:flex;align-items:center;justify-content:space-between;border-top:1px solid var(--color-hairline)}
.dr-foot .sns{font-size:11px;letter-spacing:.1em;color:var(--color-label)}
.dr-foot .lang{font-size:10px;color:var(--color-ink-tertiary);letter-spacing:.1em}
</style>
</head>
<body>

<div class="doc">STYLE DELI — モバイル ヘッダー＆メニュー（確定版）</div>
<p class="sub">PDPモック準拠 / ロゴ Tenor Sans・英字 Cormorant Garamond・本文 Zen Kaku Gothic</p>

<div class="row" id="row"></div>

<script>
const burger='<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2"><path d="M4 7h16M4 12h16M4 17h16"/></svg>';
const ic_search='<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.3"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.5-4.5"/></svg>';
const ic_heart='<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2"><path d="M12 20s-7-4.5-7-9.5A3.6 3.6 0 0 1 12 7a3.6 3.6 0 0 1 7 3.5C19 15.5 12 20 12 20z"/></svg>';
const ic_cart='<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2"><path d="M6 8h12l-1 12H7L6 8z"/><path d="M9 8a3 3 0 0 1 6 0"/></svg>';
const chev='<svg class="chev" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M2 4l4 4 4-4"/></svg>';
const u_user='<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/></svg>';
const u_heart='<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2"><path d="M12 20s-7-4.5-7-9.5A3.6 3.6 0 0 1 12 7a3.6 3.6 0 0 1 7 3.5C19 15.5 12 20 12 20z"/></svg>';
const u_point='<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>';

const header=`
  <div class="m-anno"><span>新作＆ピックアップ 24時間ポイントアップ開催中</span><span class="cta">詳細 ›</span></div>
  <div class="m-head">
    <div class="m-burger">${burger}</div>
    <div class="m-logo">STYLE DELI</div>
    <div class="m-head-ic"><div class="m-ic">${ic_search}</div><div class="m-ic">${ic_heart}</div><div class="m-ic">${ic_cart}<span class="badge">2</span></div></div>
  </div>`;

const drawer=`
  <div class="scrim"></div>
  <div class="drawer">
    <div class="dr-head"><span class="t">MENU</span><span class="dr-close"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2"><path d="M6 6l12 12M18 6L6 18"/></svg></span></div>
    <div class="dr-group-h">新着・入荷</div>
    <div class="dr-arrivals">
      <a class="a-cell"><span class="en">NEW</span><span class="jp">新着</span></a>
      <a class="a-cell"><span class="en">RESTOCK</span><span class="jp">再入荷</span></a>
      <a class="a-cell"><span class="en">PRE-ORDER</span><span class="jp">予約</span></a>
    </div>
    <div class="dr-group-h">商品から探す</div>
    <div class="dr-nav">
      <div class="di"><span class="en">CATEGORY</span>${chev}</div>
      <div class="di"><span class="en">STYLE DELI</span>${chev}</div>
      <div class="di"><span class="en">DELI by STYLE DELI</span></div>
      <div class="di"><span class="en">BLK001</span></div>
      <div class="di"><span class="en">MARJOUR</span></div>
      <div class="di outlet"><span class="en">OUTLET</span><span class="jp-tag">アウトレット</span></div>
    </div>
    <div class="dr-group-h">スタイリング</div>
    <div class="dr-styling">
      <a class="st-card"><div class="thumb">LATEST</div><span class="en">STYLING LAB</span><span class="jp">着回し・特集</span></a>
      <a class="st-card"><div class="thumb">HEIGHT</div><span class="en">STAFF WEARING</span><span class="jp">スタッフ着用</span></a>
    </div>
    <div class="dr-util">
      <a>${u_user}ログイン / 会員登録</a>
      <a>${u_heart}お気に入り</a>
      <a>${u_point}会員ステージ・ポイント</a>
    </div>
    <div class="dr-foot"><span class="sns">LINE</span><span class="lang">日本語 / JPY</span></div>
  </div>`;

const pghint=`<div class="pghint"><div class="h">新着アイテム</div><div class="g"><div></div><div></div><div></div><div></div></div></div>`;

document.getElementById('row').innerHTML=`
  <div><div class="col-label">ヘッダー（通常）</div><div class="phone">${header}${pghint}</div></div>
  <div><div class="col-label">メニュー（ハンバーガー展開）</div><div class="phone">${header}${drawer}</div></div>
`;
</script>

</body>
</html>
