<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1240">
<title>STYLE DELI – 商品一覧ページ デスクトップ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@400;500&family=Zen+Kaku+Gothic+New:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root{
  --font-serif:'Shippori Mincho', serif;       /* アクセント専用（一覧では未使用） */
  --font-sans:'Zen Kaku Gothic New', sans-serif;
  --fs-eyebrow:11px; --fs-heading:20px; --fs-nav:11px; --fs-name:13px; --fs-price:14px; --fs-count:11px;
  --tk-eyebrow:.3em; --tk-heading:.2em; --tk-nav:.16em; --tk-wide:.12em; --tk-logo:.4em;
  --bg:#faf9f7; --ink:#2a2a2a; --ink-soft:#6a6a62; --line:#ece9e4; --line-soft:#f0ede8;
  --ph:#e4dfd8; --muted:#bbb; --muted-2:#aaa;
  --color-point-bg:#faf9f7; --color-point-border:#c8a870; --color-point-strong:#8a6a30;
  --color-sale:#8a3030; --color-sale-line:#c8a0a0; --footer:#2a2a2a;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--font-sans);background:#e8e5e0;padding:32px 24px;display:flex;flex-direction:column;align-items:center;gap:36px;color:var(--ink)}
.doc{font-size:16px;letter-spacing:.1em;color:#777;font-weight:500;text-align:center}
p.sub{font-size:10px;color:#bbb;letter-spacing:.06em;text-align:center}
.frame-label{font-size:11px;font-weight:500;letter-spacing:var(--tk-wide);color:#555;text-align:center;margin-bottom:10px}
.desktop{width:1180px;max-width:100%;background:var(--bg);border:1px solid #c8c4be;border-radius:10px;overflow:hidden;box-shadow:0 8px 32px rgba(0,0,0,.12);position:relative}

/* ── announcement（全ページ共通） ── */
.announce{display:flex;align-items:center;justify-content:center;gap:12px;background:var(--ink);color:#efece6;font-size:10px;letter-spacing:.1em;padding:8px 12px}
.announce .adot{opacity:.45}
.announce .alink{color:#efece6;opacity:.85;text-decoration:none;border-bottom:0.5px solid rgba(255,255,255,.4);padding-bottom:1px}
/* ── header（トップと同一の共通ヘッダー：ロゴ行＋ナビ行） ── */
.hdr{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:0 36px;height:74px;border-bottom:1px solid var(--line)}
.hdr-search{display:flex;align-items:center;gap:8px;color:var(--muted-2);font-size:11px;letter-spacing:.04em;border-bottom:0.5px solid #d9d4cc;padding:6px 2px;max-width:190px}
.hdr-search svg{flex-shrink:0}
.hdr-logo{font-size:19px;letter-spacing:.42em;font-weight:400;text-align:center}
.hdr-icons{display:flex;gap:18px;justify-self:end}
.hdr-icons svg{display:block}
.hdr-nav{display:flex;justify-content:center;gap:34px;padding:15px 0;border-bottom:1px solid var(--line)}
.hdr-nav a{font-size:11px;letter-spacing:.18em;color:var(--ink);text-decoration:none}

/* ── 見出し（中央・ゴシック） ── */
.cat{padding:40px 36px 18px;text-align:center}
.cat .eyebrow{font-size:var(--fs-eyebrow);letter-spacing:var(--tk-eyebrow);color:var(--muted-2);font-weight:400;margin-bottom:11px}
.cat .jp{font-size:var(--fs-heading);font-weight:500;letter-spacing:var(--tk-heading);color:var(--ink)}

/* ── ツールバー ── */
.toolbar{display:flex;align-items:center;justify-content:space-between;padding:0 36px;height:52px;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.tb-left{display:flex;align-items:center;gap:20px}
.tb-btn{display:flex;align-items:center;gap:7px;font-size:11px;letter-spacing:var(--tk-wide);color:var(--ink);cursor:pointer}
.tb-count{font-size:var(--fs-count);color:var(--muted);letter-spacing:.1em}
.tb-right{display:flex;align-items:center;gap:22px}
.tb-sort{display:flex;align-items:center;gap:7px;font-size:11px;letter-spacing:var(--tk-wide);color:var(--ink);cursor:pointer}
.tb-cols{display:flex;gap:10px;align-items:center}
.tb-cols svg{cursor:pointer}

/* ── 絞り込み中タグ ── */
.ftags{display:flex;gap:8px;padding:14px 36px 0}
.ftag{display:inline-flex;align-items:center;gap:5px;font-size:10px;letter-spacing:.08em;border:0.5px solid var(--ink);padding:5px 11px}
.ftag-x{color:var(--muted-2)}
.fclear{font-size:10px;color:var(--muted);border-bottom:1px solid #ddd;padding-bottom:1px;align-self:center}

/* ── グリッド（4列） ── */
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:30px 22px;padding:24px 36px 8px}
.cell{position:relative}
.img{position:relative;width:100%;aspect-ratio:4/5;background:var(--ph);overflow:hidden;margin-bottom:11px}
.img-ph{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:8px;color:#c0bab3;letter-spacing:.06em}
.badges{position:absolute;top:9px;left:9px;display:flex;flex-direction:column;gap:4px}
.badge{font-size:8px;letter-spacing:.1em;padding:3px 6px;line-height:1.4;background:var(--bg)}
.badge-point{color:var(--color-point-strong);border:0.5px solid var(--color-point-border)}
.badge-rear,.badge-pre,.badge-free{color:var(--ink-soft);border:0.5px solid #c8c4b8}
.badge-sale{color:var(--color-sale);border:0.5px solid var(--color-sale-line)}
.heart{position:absolute;top:9px;right:9px;width:28px;height:28px;border-radius:50%;background:rgba(250,249,247,.85);display:flex;align-items:center;justify-content:center;cursor:pointer}
.chips{display:flex;gap:5px;align-items:center;margin-bottom:7px}
.chip{width:12px;height:12px;border-radius:50%;border:0.5px solid rgba(0,0,0,.08)}
.chip.active{outline:1.5px solid var(--ink);outline-offset:1.5px}
.more{font-size:9px;color:var(--muted)}
.name{font-size:var(--fs-name);font-weight:400;line-height:1.55;margin-bottom:5px}
.prow{display:flex;align-items:baseline;gap:6px;flex-wrap:wrap}
.price{font-size:var(--fs-price);font-weight:400}
.tax{font-size:10px;color:var(--muted)}
.orig{font-size:11px;color:var(--muted);text-decoration:line-through}
.sale{font-size:var(--fs-price);font-weight:500;color:var(--color-sale)}

/* ── pager ── */
.pager{display:flex;align-items:center;justify-content:center;gap:6px;padding:30px}
.pg{width:34px;height:34px;display:flex;align-items:center;justify-content:center;font-size:12px;border:0.5px solid transparent;cursor:pointer}
.pg.active{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.pg.arr{color:var(--muted-2);border:none;font-size:17px}

/* ── recently viewed ── */
.rv{border-top:1px solid var(--line);padding:26px 36px 10px}
.rv-t{font-size:10px;letter-spacing:var(--tk-eyebrow);color:var(--muted-2)}
.rv-row{display:flex;gap:18px;padding:14px 36px 30px}
.rv-card{width:130px}
.rv-img{width:130px;height:162px;background:var(--ph);margin-bottom:7px}
.rv-name{font-size:11px;line-height:1.45;margin-bottom:2px}
.rv-price{font-size:11px;color:var(--muted-2)}

/* ── footer ── */
.ftr{background:var(--footer);padding:26px;text-align:center}
.ftr a{font-size:10px;color:#888;letter-spacing:.08em;text-decoration:none;margin:0 10px}
.ftr-copy{font-size:9px;color:#666;margin-top:12px}

/* ══ 絞り込みドロワー（右スライド・モバイルモーダルと共通UI） ══ */
.overlay{position:absolute;inset:0;background:rgba(42,42,42,.32);z-index:20}
.drawer{position:absolute;top:0;right:0;bottom:0;width:400px;background:var(--bg);z-index:21;display:flex;flex-direction:column;box-shadow:-8px 0 30px rgba(0,0,0,.16)}
.dr-head{display:flex;align-items:center;justify-content:space-between;padding:20px 24px 16px;border-bottom:1px solid var(--line)}
.dr-title{font-size:13px;font-weight:500;letter-spacing:.16em}
.dr-x{font-size:20px;color:var(--muted-2);font-weight:300;cursor:pointer}
.dr-body{flex:1;overflow-y:auto}
.sec{border-bottom:1px solid var(--line-soft);padding:16px 24px}
.sec-label{font-size:11px;font-weight:500;letter-spacing:.14em;margin-bottom:12px}
.kw{display:flex;flex-wrap:wrap;gap:8px}
.kw span{font-size:10px;letter-spacing:.06em;border:0.5px solid #d6d1c8;padding:6px 12px;background:#fff}
.toggle-row{display:flex;align-items:center;justify-content:space-between}
.toggle-txt{font-size:12px}.toggle-txt small{color:var(--muted-2)}
.switch{width:38px;height:21px;border-radius:11px;background:#dcd7cf;position:relative}
.switch.on{background:var(--ink)}
.switch::after{content:"";position:absolute;top:2px;left:2px;width:17px;height:17px;border-radius:50%;background:#fff}
.switch.on::after{left:19px}
.acc{border-bottom:1px solid var(--line-soft)}
.acc-h{display:flex;align-items:center;justify-content:space-between;padding:16px 24px;cursor:pointer}
.acc-h .t{font-size:11px;font-weight:500;letter-spacing:.14em;display:flex;gap:8px;align-items:baseline}
.acc-h .sel{font-size:10px;color:var(--ink-soft);font-weight:400}
.acc-h .cv{font-size:11px;color:var(--muted-2)}
.acc-b{padding:0 24px 16px}
.ck{display:flex;align-items:center;gap:10px;padding:8px 0}
.ck-box{width:15px;height:15px;border:1px solid #c4bfb6;border-radius:2px}
.ck-l{font-size:12px}.ck-l small{color:var(--muted-2);margin-left:3px}
.swg{display:grid;grid-template-columns:repeat(4,1fr);gap:14px 8px}
.sw{display:flex;flex-direction:column;align-items:center;gap:6px;cursor:pointer}
.sw-d{width:30px;height:30px;border-radius:50%;border:0.5px solid rgba(0,0,0,.1)}
.sw.active .sw-d{outline:1.5px solid var(--ink);outline-offset:2px}
.sw-n{font-size:9px;color:var(--ink-soft)}
.szg{display:flex;flex-wrap:wrap;gap:8px}
.sz{min-width:46px;text-align:center;font-size:11px;border:0.5px solid #d6d1c8;padding:9px 6px;cursor:pointer}
.sz.active{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.dr-foot{display:flex;align-items:center;gap:16px;padding:16px 24px;border-top:1px solid var(--line)}
.reset{font-size:11px;color:var(--ink-soft);border-bottom:1px solid #ddd;padding-bottom:1px}
.apply{flex:1;background:var(--ink);color:var(--bg);text-align:center;padding:14px;font-size:12px;letter-spacing:.14em;font-weight:500}
</style>
</head>
<body>

<div class="doc">STYLE DELI — 商品一覧ページ（デスクトップ）</div>
<p class="sub">1180px / ヘッダー＝トップと共通（アナウンス＋ロゴ行＋ナビ行）/ 4列グリッド / フィルター＝右ドロワー</p>

<div id="root"></div>

<script>
const prods = [
  {b:[['point','POINT 10x'],['rear','BACK IN STOCK']], c:['#d4cec8','#2a2a2a','#8a9a8a'], more:'+1', n:'プリーツワイドパンツ', p:'<span class="price">¥14,500</span><span class="tax">税込</span>'},
  {b:[['sale','SALE']], c:['#c8b4a0','#2a2a2a'], n:'リネンブレンドオーバーサイズシャツ', p:'<span class="orig">¥12,800</span><span class="sale">¥9,600</span>'},
  {b:[['pre','予約'],['free','送料無料']], c:['#8a9a8a','#d4cec8','#c8b4a0'], n:'ウールブレンドテーラードジャケット', p:'<span class="price">¥22,000</span><span class="tax">税込</span>'},
  {b:[], c:['#2a2a2a'], n:'ドレープワンピース', p:'<span class="price">¥18,900</span><span class="tax">税込</span>'},
  {b:[['point','POINT 10x']], c:['#d4cec8','#8a9a8a'], n:'ハイウエストパンツ', p:'<span class="price">¥14,500</span><span class="tax">税込</span>'},
  {b:[['rear','BACK IN STOCK'],['sale','SALE']], c:['#c8b4a0','#2a2a2a','#d4cec8'], more:'+2', n:'シルクライクサテンブラウス', p:'<span class="orig">¥16,500</span><span class="sale">¥12,400</span>'},
  {b:[], c:['#6b4f3a','#2a2a2a'], n:'テーパードスラックス', p:'<span class="price">¥16,000</span><span class="tax">税込</span>'},
  {b:[['free','送料無料']], c:['#f3f1ee','#b8b4ad'], n:'コットンリネンブラウス', p:'<span class="price">¥11,800</span><span class="tax">税込</span>'},
];
const heart = `<div class="heart"><svg width="13" height="13" viewBox="0 0 12 12" fill="none" stroke="#2a2a2a" stroke-width="1"><path d="M6 10.5s-5-3.2-5-6.5A2.7 2.7 0 0 1 6 2 2.7 2.7 0 0 1 11 4C11 7.3 6 10.5 6 10.5z"/></svg></div>`;
function cell(pr){
  const badges = pr.b.length?`<div class="badges">${pr.b.map(([k,t])=>`<span class="badge badge-${k}">${t}</span>`).join('')}</div>`:'';
  const chips = `<div class="chips">${pr.c.map((h,i)=>`<div class="chip${i===0?' active':''}" style="background:${h}"></div>`).join('')}${pr.more?`<span class="more">${pr.more}</span>`:''}</div>`;
  return `<div class="cell"><div class="img"><div class="img-ph">4:5</div>${badges}${heart}</div>${chips}<div class="name">${pr.n}</div><div class="prow">${pr.p}</div></div>`;
}
const grid = `<div class="grid">${prods.map(cell).join('')}</div>`;

const icon = (p)=>`<svg width="19" height="19" viewBox="0 0 19 19" fill="none" stroke="#2a2a2a" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round">${p}</svg>`;
const header = `
  <div class="announce"><span>新作＆ピックアップ商品　24時間ポイントアップ開催中</span><span class="adot">●</span><span>¥15,000以上で送料無料</span><a class="alink" href="#">詳細 ›</a></div>
  <div class="hdr">
    <div class="hdr-search">${icon('<circle cx="8" cy="8" r="5.2"/><line x1="12" y1="12" x2="17" y2="17"/>')}<span>アイテムを検索</span></div>
    <div class="hdr-logo">STYLE DELI</div>
    <div class="hdr-icons">${icon('<circle cx="9.5" cy="5.5" r="2.6"/><path d="M3.5 16c0-3.3 2.7-5.5 6-5.5s6 2.2 6 5.5"/>')}${icon('<path d="M9.5 16.5S3 12.5 3 8a3.3 3.3 0 0 1 6.5-1A3.3 3.3 0 0 1 16 8c0 4.5-6.5 8.5-6.5 8.5z"/>')}${icon('<path d="M4 4h12l-1.5 9h-9L4 4z"/><circle cx="8" cy="16.5" r="1"/><circle cx="13.5" cy="16.5" r="1"/>')}</div>
  </div>
  <nav class="hdr-nav"><a href="#">NEW</a><a href="#">CATEGORY ∨</a><a href="#">BRAND ∨</a><a href="#">STYLING</a><a href="#">OUTLET</a></nav>`;
const heading = `<div class="cat"><div class="eyebrow">NEW ARRIVALS</div><div class="jp">新着アイテム</div></div>`;
const toolbar = `
  <div class="toolbar">
    <div class="tb-left">
      <div class="tb-btn">${icon('<line x1="2" y1="5" x2="17" y2="5"/><line x1="5" y1="9.5" x2="14" y2="9.5"/><line x1="8" y1="14" x2="11" y2="14"/>')}絞り込み</div>
      <div class="tb-count">全61点</div>
    </div>
    <div class="tb-right">
      <div class="tb-sort">新着順 ${icon('<path d="M5 8l4 4 4-4"/>')}</div>
      <div class="tb-cols">
        <svg width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="#bbb" stroke-width="1.2"><rect x="1" y="1" width="3.5" height="16"/><rect x="5.5" y="1" width="3.5" height="16"/><rect x="10" y="1" width="3.5" height="16"/><rect x="14.5" y="1" width="3.5" height="16" opacity="0"/></svg>
        <svg width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="#2a2a2a" stroke-width="1.2"><rect x="1" y="1" width="3.2" height="16"/><rect x="5.4" y="1" width="3.2" height="16"/><rect x="9.8" y="1" width="3.2" height="16"/><rect x="14.2" y="1" width="3.2" height="16"/></svg>
      </div>
    </div>
  </div>`;
const ftags = `<div class="ftags"><div class="ftag">カラー：ブラック <span class="ftag-x">×</span></div><div class="ftag">サイズ：02 <span class="ftag-x">×</span></div><div class="fclear">すべて解除</div></div>`;
const pager = `<div class="pager"><div class="pg arr">‹</div><div class="pg active">1</div><div class="pg">2</div><div class="pg">3</div><div style="color:#ccc">…</div><div class="pg">9</div><div class="pg arr">›</div></div>`;
const rv = `<div class="rv"><span class="rv-t">RECENTLY VIEWED</span></div><div class="rv-row">${[['テーラードジャケット','¥22,000'],['ドレープワンピース','¥18,900'],['リネンシャツ','¥12,800'],['ハイウエストパンツ','¥14,500'],['サテンブラウス','¥12,400']].map(([n,p])=>`<div class="rv-card"><div class="rv-img"></div><div class="rv-name">${n}</div><div class="rv-price">${p}</div></div>`).join('')}</div>`;
const footer = `<div class="ftr"><div><a href="#">ショッピングガイド</a><a href="#">よくある質問</a><a href="#">お問い合わせ</a></div><div class="ftr-copy">© STYLE DELI All Rights Reserved.</div></div>`;

const page = (withTags)=> header + heading + (withTags?ftags:'') + toolbar + grid + pager + rv + footer;

/* ── ドロワー（フィルター・モバイルモーダルと共通内容） ── */
const colors = [['ホワイト','#f3f1ee'],['グレー','#b8b4ad'],['ブラック','#2a2a2a'],['ブラウン','#6b4f3a'],['ベージュ','#cbb89d'],['グリーン','#7c8a6f'],['ブルー','#5a6b86'],['パープル','#7a6a86'],['イエロー','#d8c87a'],['ピンク','#d8a9aa'],['レッド','#9a3b3b'],['シルバー','#c3c3c3']];
const sizes = ['FREE','XS','S','M','L','LL','01','02','03'];
const brands = [['BLK001',18],['marjour',24],['DELI by',12],['DRESSDEN',7]];
const cats = [['トップス',24],['ワンピース',18],['ボトムス',12],['セットアップ',6],['アウター',5],['バッグ・アクセサリー',8]];
const drawer = `
  <div class="overlay"></div>
  <div class="drawer">
    <div class="dr-head"><div class="dr-title">絞り込み</div><div class="dr-x">×</div></div>
    <div class="dr-body">
      <div class="sec"><div class="sec-label">人気キーワード</div><div class="kw">${['体型カバー','洗える','セットアップ','送料無料','メイドインジャパン','大人カジュアル'].map(k=>`<span>${k}</span>`).join('')}</div></div>
      <div class="sec"><div class="toggle-row"><div class="toggle-txt">在庫ありのみ表示 <small>(42)</small></div><div class="switch on"></div></div></div>
      <div class="acc"><div class="acc-h"><div class="t">ブランド</div><div class="cv">∨</div></div><div class="acc-b">${brands.map(([n,c])=>`<div class="ck"><div class="ck-box"></div><div class="ck-l">${n}<small>(${c})</small></div></div>`).join('')}</div></div>
      <div class="acc"><div class="acc-h"><div class="t">カテゴリ</div><div class="cv">∧</div></div><div class="acc-b">${cats.map(([n,c])=>`<div class="ck"><div class="ck-box"></div><div class="ck-l">${n}<small>(${c})</small></div></div>`).join('')}</div></div>
      <div class="acc"><div class="acc-h"><div class="t">カラー <span class="sel">ブラック</span></div><div class="cv">∧</div></div><div class="acc-b"><div class="swg">${colors.map(([n,h])=>`<div class="sw${n==='ブラック'?' active':''}"><div class="sw-d" style="background:${h}"></div><div class="sw-n">${n}</div></div>`).join('')}</div></div></div>
      <div class="acc"><div class="acc-h"><div class="t">サイズ <span class="sel">02</span></div><div class="cv">∧</div></div><div class="acc-b"><div class="szg">${sizes.map(s=>`<div class="sz${s==='02'?' active':''}">${s}</div>`).join('')}</div></div></div>
      <div class="acc"><div class="acc-h"><div class="t">お手入れ</div><div class="cv">∨</div></div></div>
      <div class="acc"><div class="acc-h"><div class="t">価格（税込）</div><div class="cv">∨</div></div></div>
    </div>
    <div class="dr-foot"><div class="reset">リセット</div><div class="apply">14件を表示</div></div>
  </div>`;

document.getElementById('root').innerHTML = `
  <div style="display:flex;flex-direction:column;align-items:center;gap:36px">
    <div><div class="frame-label">通常表示（4列グリッド）</div><div class="desktop">${page(false)}</div></div>
    <div><div class="frame-label">絞り込みドロワー展開（右スライド・選択中：ブラック・02・在庫あり）</div><div class="desktop">${page(true)}${drawer}</div></div>
