<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1240">
<title>STYLE DELI – デスクトップ ナビ マウスオーバー（ITEM左：新着・入荷）</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700&family=Cormorant+Garamond:wght@500;600&family=Tenor+Sans&display=swap" rel="stylesheet">
<style>
:root{
  --color-ink:#2a2a2a; --color-label:#5a5a52; --color-ink-secondary:#7a7570; --color-caption:#8a8580; --color-ink-muted:#9a9490; --color-ink-tertiary:#bbb; --color-border:#ddd;
  --color-bg:#faf9f7; --color-panel:#f5f2ec; --color-hairline:#ece9e4; --color-hairline-2:#e4dfd8;
  --color-ph-1:#e5e0d6; --color-gold:#b98f40;
  --font-body:'Zen Kaku Gothic New','Hiragino Kaku Gothic ProN','Yu Gothic',sans-serif;
  --font-serif-en:'Cormorant Garamond','Times New Roman',serif;
  --font-logo:'Tenor Sans',sans-serif;
  --tracking-eyebrow:.18em;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--font-body);background:#e8e5e0;padding:32px 24px;display:flex;flex-direction:column;align-items:center;gap:36px;color:var(--color-ink)}
.doc{font-size:16px;letter-spacing:.1em;color:#777;font-weight:500;text-align:center}
p.sub{font-size:10px;color:var(--color-ink-tertiary);letter-spacing:.06em;text-align:center}
.frame-label{font-size:11px;font-weight:500;letter-spacing:.12em;color:#555;text-align:center;margin-bottom:10px}
.desktop{width:1120px;max-width:100%;height:480px;background:var(--color-bg);border:1px solid #c8c4be;border-radius:10px;overflow:hidden;box-shadow:0 8px 32px rgba(0,0,0,.12);position:relative}

/* 確定ヘッダー */
.announce{display:flex;align-items:center;justify-content:center;gap:10px;background:var(--color-ink);color:#f3efe9;font-size:10px;letter-spacing:.08em;padding:8px 12px}
.announce .cta{color:var(--color-gold);letter-spacing:.1em}
.hdr{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:0 36px;height:64px;border-bottom:1px solid var(--color-hairline)}
.hdr-search{display:flex;align-items:center;gap:8px;color:var(--color-ink-muted);font-size:11px;border-bottom:0.5px solid #d9d4cc;padding:6px 2px;max-width:180px}
.hdr-logo{font-family:var(--font-logo);font-size:18px;letter-spacing:.42em;text-align:center;padding-left:.42em}
.hdr-icons{display:flex;gap:18px;justify-self:end}
.hdr-nav{display:flex;justify-content:center;gap:22px;padding:13px 0;border-bottom:1px solid var(--color-hairline);position:relative;z-index:30;background:var(--color-bg)}
.hdr-nav a{font-family:var(--font-serif-en);font-size:13px;letter-spacing:.08em;color:var(--color-ink);text-decoration:none;padding-bottom:3px;white-space:nowrap}
.hdr-nav a svg{margin-left:5px;opacity:.5;vertical-align:middle}
.hdr-nav a.active{border-bottom:1px solid var(--color-ink)}
.hdr-nav a.outlet{color:var(--color-gold)}

.stage{position:relative;flex:1}
.behind{padding:22px 36px;opacity:.42}
.behind .h{text-align:center;font-family:var(--font-serif-en);font-size:18px;letter-spacing:.16em;margin-bottom:16px}
.behind .g{display:grid;grid-template-columns:repeat(4,1fr);gap:18px}
.behind .c{height:110px;background:var(--color-ph-1)}
.overlay{position:absolute;inset:0;background:rgba(42,42,42,.26);z-index:20}

/* ドロップダウン */
.dd{position:absolute;top:0;left:0;right:0;background:var(--color-bg);z-index:25;box-shadow:0 12px 28px rgba(0,0,0,.12);border-bottom:1px solid var(--color-hairline);padding:28px 40px 32px}
.dd-eyebrow{font-family:var(--font-serif-en);font-size:11px;letter-spacing:var(--tracking-eyebrow);color:var(--color-caption);margin-bottom:14px}
.lab{font-family:var(--font-serif-en);font-size:11px;letter-spacing:var(--tracking-eyebrow);color:var(--color-caption);margin-bottom:12px}

/* ITEM：左＝新着・入荷（縦）／右＝カテゴリ */
.item-dd{display:flex;gap:40px}
.item-left{width:248px;flex-shrink:0;border-right:1px solid var(--color-hairline);padding-right:36px}
.item-right{flex:1;min-width:0}
.arr-list{display:flex;flex-direction:column}
.arr-item{display:flex;align-items:center;gap:13px;padding:11px 4px;cursor:pointer;transition:background .15s}
.arr-item + .arr-item{border-top:1px solid var(--color-hairline)}
.arr-item:hover{background:var(--color-panel)}
.arr-item .thumb{width:48px;height:48px;background:var(--color-ph-1);flex-shrink:0}
.arr-item .en{font-family:var(--font-serif-en);font-size:16px;letter-spacing:.1em;display:block}
.arr-item .jp{font-size:11px;color:var(--color-ink-secondary);display:block;margin-top:2px}
.arr-item .arw{margin-left:auto;color:var(--color-ink-muted);font-size:14px}

/* カテゴリ列（特集バナーなし） */
.mcols{display:flex;gap:28px}
.mcol{flex:1;min-width:0}
.mgrp{margin-bottom:16px}
.mgrp .mh{font-family:var(--font-serif-en);font-size:14px;letter-spacing:.1em;margin-bottom:8px}
.mgrp a{display:block;font-size:11px;color:var(--color-ink-secondary);text-decoration:none;padding:4px 0}

/* STYLING：最新コーデ2カラム */
.styling-cols{display:flex;gap:40px}
.scol{flex:1}
.scol-h{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:14px;border-bottom:1px solid var(--color-hairline);padding-bottom:10px}
.scol-h .en{font-family:var(--font-serif-en);font-size:16px;letter-spacing:.12em}
.scol-h .jp{font-size:10px;color:var(--color-caption);margin-left:6px}
.scol-h .more{font-size:10px;letter-spacing:.1em;color:var(--color-ink-muted)}
.coord-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.coord{cursor:pointer}
.coord .cimg{width:100%;aspect-ratio:3/4;background:var(--color-ph-1);margin-bottom:7px}
.coord .ct{font-size:10.5px;color:var(--color-ink-secondary);line-height:1.4}
.coord .cm{font-size:9px;color:var(--color-ink-muted);margin-top:2px}
</style>
</head>
<body>

<div class="doc">STYLE DELI — デスクトップ ナビ マウスオーバー</div>
<p class="sub">ITEM＝左:新着・入荷／右:カテゴリ（特集バナー削除）/ STYLE DELIのみ展開・他ブランド直リンク / STYLING＝最新コーデ</p>

<div id="root"></div>

<script>
const ic=(p)=>`<svg width="18" height="18" viewBox="0 0 19 19" fill="none" stroke="#2a2a2a" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round">${p}</svg>`;
const navItems=['ITEM','STYLE DELI','DELI by STYLE DELI','BLK001','MARJOUR','STYLING','OUTLET'];
const hasDD=['ITEM','STYLE DELI','STYLING'];
const chevDown='<svg width="9" height="9" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M2 4l4 4 4-4"/></svg>';
function header(active){
  const nav=navItems.map(en=>`<a href="#" class="${en===active?'active':''} ${en==='OUTLET'?'outlet':''}">${en}${hasDD.includes(en)?chevDown:''}</a>`).join('');
  return `
   <div class="announce"><span>新作＆ピックアップ商品 24時間ポイントアップ開催中</span><span style="color:var(--color-gold);opacity:.6">●</span><span>¥15,000以上で送料無料</span><span class="cta">詳細 ›</span></div>
   <div class="hdr">
     <div class="hdr-search">${ic('<circle cx="8" cy="8" r="5.2"/><line x1="12" y1="12" x2="17" y2="17"/>')}<span>アイテムを検索</span></div>
     <div class="hdr-logo">STYLE DELI</div>
     <div class="hdr-icons">${ic('<circle cx="9.5" cy="5.5" r="2.6"/><path d="M3.5 16c0-3.3 2.7-5.5 6-5.5s6 2.2 6 5.5"/>')}${ic('<path d="M9.5 16.5S3 12.5 3 8a3.3 3.3 0 0 1 6.5-1A3.3 3.3 0 0 1 16 8c0 4.5-6.5 8.5-6.5 8.5z"/>')}${ic('<path d="M4 4h12l-1.5 9h-9L4 4z"/><circle cx="8" cy="16.5" r="1"/><circle cx="13.5" cy="16.5" r="1"/>')}</div>
   </div>
   <nav class="hdr-nav">${nav}</nav>`;
}
const behind=`<div class="behind"><div class="h">新着アイテム</div><div class="g"><div class="c"></div><div class="c"></div><div class="c"></div><div class="c"></div></div></div>`;

/* 新着・入荷（縦・左サイド） */
const arrList=`<div class="arr-list">
  <a class="arr-item"><div class="thumb"></div><div><span class="en">NEW</span><span class="jp">新着</span></div><span class="arw">›</span></a>
  <a class="arr-item"><div class="thumb"></div><div><span class="en">RESTOCK</span><span class="jp">再入荷</span></div><span class="arw">›</span></a>
  <a class="arr-item"><div class="thumb"></div><div><span class="en">PRE-ORDER</span><span class="jp">予約</span></div><span class="arw">›</span></a>
</div>`;

/* カテゴリ列（代表値・cat_*構成で差替） */
const catCols=[
 [{h:'トップス',subs:['カットソー・Tシャツ','ニット・セーター','シャツ・ブラウス','ベスト','パーカー']}],
 [{h:'パンツ',subs:['ワイドパンツ','テーパード','デニム']},{h:'スカート',subs:['ロング','ミディ','タイト']}],
 [{h:'ワンピース',subs:['ロング','ミディ','シャツワンピ']},{h:'セットアップ',subs:[]}],
 [{h:'アウター',subs:['ジャケット','コート','カーディガン']}],
 [{h:'バッグ・小物',subs:['バッグ','アクセサリー','ジュエリー','靴','ファッショングッズ']}],
];
const catColsHTML=`<div class="mcols">${catCols.map(col=>`<div class="mcol">${col.map(g=>`<div class="mgrp"><div class="mh">${g.h}</div>${g.subs.map(s=>`<a href="#">${s}</a>`).join('')}</div>`).join('')}</div>`).join('')}</div>`;

/* ITEM */
const ddItem=`<div class="dd"><div class="item-dd">
  <div class="item-left"><div class="lab">新着・入荷</div>${arrList}</div>
  <div class="item-right"><div class="dd-eyebrow">CATEGORY ｜ カテゴリーから探す</div>${catColsHTML}</div>
</div></div>`;

/* STYLE DELI（ブランドのカテゴリのみ） */
const ddStyledeli=`<div class="dd"><div class="dd-eyebrow">STYLE DELI ｜ ブランドのアイテム</div>${catColsHTML}</div>`;

/* STYLING（最新コーデ） */
const ddStyling=`<div class="dd"><div class="styling-cols">
  <div class="scol">
    <div class="scol-h"><div><span class="en">STYLING LAB</span><span class="jp">着回し・特集</span></div><span class="more">最新コーデ ›</span></div>
    <div class="coord-grid">
      <div class="coord"><div class="cimg"></div><div class="ct">涼しく見える服</div><div class="cm">2025.05.08</div></div>
      <div class="coord"><div class="cimg"></div><div class="ct">初夏のきれいめカジュアル</div><div class="cm">2025.05.01</div></div>
      <div class="coord"><div class="cimg"></div><div class="ct">一枚で決まるワンピース</div><div class="cm">2025.04.24</div></div>
    </div>
  </div>
  <div class="scol">
    <div class="scol-h"><div><span class="en">STAFF WEARING</span><span class="jp">スタッフ着用</span></div><span class="more">最新コーデ ›</span></div>
    <div class="coord-grid">
      <div class="coord"><div class="cimg"></div><div class="ct">スタッフ 田中</div><div class="cm">162cm / 着用01</div></div>
      <div class="coord"><div class="cimg"></div><div class="ct">スタッフ 山田</div><div class="cm">158cm / 着用02</div></div>
      <div class="coord"><div class="cimg"></div><div class="ct">スタッフ 鈴木</div><div class="cm">165cm / 着用M</div></div>
    </div>
  </div>
</div></div>`;

const frame=(active,dd)=>`<div class="desktop">${header(active)}<div class="stage">${behind}<div class="overlay"></div>${dd}</div></div>`;

document.getElementById('root').innerHTML=`
  <div style="display:flex;flex-direction:column;align-items:center;gap:36px">
    <div><div class="frame-label">ITEM 展開（左：新着・入荷／右：カテゴリー）</div>${frame('ITEM',ddItem)}</div>
    <div><div class="frame-label">STYLE DELI 展開（ブランドのカテゴリ）<br><small style="font-weight:400;color:#999">※他ブランドはシングルリンク</small></div>${frame('STYLE DELI',ddStyledeli)}</div>
    <div><div class="frame-label">STYLING 展開（LAB／WEARING の最新コーデ）</div>${frame('STYLING',ddStyling)}</div>
  </div>`;
</script>

</body>
</html>
