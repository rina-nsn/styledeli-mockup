<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=900">
<title>STYLE DELI – 検索結果ページ v1</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700&family=Italiana&family=Tenor+Sans&display=swap" rel="stylesheet">
<style>
:root{
  --color-ink:#2a2a2a; --color-label:#5a5a52; --color-ink-secondary:#7a7570; --color-caption:#8a8580; --color-ink-muted:#9a9490; --color-ink-tertiary:#bbb; --color-border:#ddd;
  --color-bg:#faf9f7; --color-panel:#f5f2ec; --color-hairline:#ece9e4; --color-hairline-2:#e4dfd8;
  --color-ph-1:#e5e0d6; --color-ph-ink:#b9b1a4; --color-gold:#b98f40;
  --color-sale:#8a3030; --color-sale-bg:#f5e8e8; --color-sale-border:#d8a0a0;
  --color-point:#8a6030; --color-point-bg:#f5ede0; --color-point-border:#d8c090;
  --color-preorder:#4a5870; --color-preorder-bg:#eceef3; --color-preorder-border:#b8c0d0;
  --color-neutral-bg:#f0f0ee; --color-neutral-border:#c8c4b8;
  --font-body:'Zen Kaku Gothic New','Hiragino Kaku Gothic ProN','Yu Gothic',sans-serif;
  --font-serif-en:'Italiana','Times New Roman',serif;
  --font-logo:'Tenor Sans',sans-serif;
  --tracking-eyebrow:.18em; --tracking-heading:.14em;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--font-body);background:#e8e5e0;padding:32px 24px;display:flex;flex-direction:column;align-items:center;gap:30px;color:var(--color-ink)}
.doc{font-size:16px;letter-spacing:.1em;color:#777;font-weight:500;text-align:center}
p.sub{font-size:10px;color:#bbb;letter-spacing:.06em;text-align:center}
.row{display:flex;gap:28px;flex-wrap:wrap;justify-content:center;align-items:flex-start}
.col-label{font-size:11px;font-weight:500;letter-spacing:.12em;color:#555;text-align:center;margin-bottom:10px}
.phone{width:375px;height:720px;border-radius:14px;border:1px solid #c8c4be;box-shadow:0 8px 32px rgba(0,0,0,.12);overflow-y:auto;overflow-x:hidden;background:var(--color-bg);scrollbar-width:none}
.phone::-webkit-scrollbar{display:none}

/* 確定ヘッダー */
.m-anno{background:var(--color-ink);color:#f3efe9;font-size:9px;letter-spacing:.08em;padding:7px 14px;display:flex;align-items:center;justify-content:center;gap:10px}
.m-anno .cta{color:var(--color-gold);letter-spacing:.1em;white-space:nowrap}
.m-head{height:54px;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:0 14px;border-bottom:1px solid var(--color-hairline);position:sticky;top:0;background:var(--color-bg);z-index:10}
.m-burger{justify-self:start;color:var(--color-ink)}
.m-logo{justify-self:center;font-family:var(--font-logo);font-size:15px;letter-spacing:.34em;padding-left:.34em;color:var(--color-ink)}
.m-head-ic{display:flex;gap:14px;justify-self:end;align-items:center;color:var(--color-ink)}
.m-ic{position:relative}
.m-ic .badge{position:absolute;top:-4px;right:-5px;background:var(--color-ink);color:var(--color-bg);font-size:7px;width:12px;height:12px;border-radius:50%;display:flex;align-items:center;justify-content:center}

/* 検索フィールド（クエリ入り） */
.search-ctx{padding:14px 16px 2px}
.search-field{display:flex;align-items:center;gap:9px;border:1px solid var(--color-hairline-2);padding:10px 12px;color:var(--color-ink)}
.search-field .q{flex:1;font-size:13px;letter-spacing:.02em}
.search-field .clr{color:var(--color-ink-muted);font-size:15px}
/* 結果サマリ＋件数 */
.result-line{font-size:11px;color:var(--color-ink-secondary);padding:12px 16px 2px}
.result-line b{font-weight:500;color:var(--color-ink)}
.result-count{font-size:10px;color:var(--color-ink-tertiary);letter-spacing:.1em;padding:2px 16px 10px}

/* ツールバー */
.toolbar{display:flex;align-items:center;border-top:1px solid var(--color-hairline);border-bottom:1px solid var(--color-hairline)}
.toolbar-btn{flex:1;display:flex;align-items:center;justify-content:center;gap:5px;padding:10px 6px;font-size:9px;letter-spacing:.12em;color:var(--color-ink);border-right:1px solid var(--color-hairline)}
.toolbar-btn:last-child{flex:0;padding:10px 14px}

/* グリッド・バッジ（確定配色） */
.prods-2{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:12px 12px 4px}
.prod-img-wrap{position:relative;width:100%;aspect-ratio:4/5;background:var(--color-ph-1);overflow:hidden;margin-bottom:7px}
.prod-img-ph{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:7px;color:var(--color-ph-ink)}
.prod-badges{position:absolute;top:7px;left:7px;display:flex;flex-direction:column;gap:3px}
.badge{font-size:7px;letter-spacing:.1em;padding:2px 5px;line-height:1.4}
.badge-point{background:var(--color-point-bg);color:var(--color-point);border:0.5px solid var(--color-point-border)}
.badge-sale{background:var(--color-sale-bg);color:var(--color-sale);border:0.5px solid var(--color-sale-border)}
.badge-pre{background:var(--color-preorder-bg);color:var(--color-preorder);border:0.5px solid var(--color-preorder-border)}
.badge-rear{background:var(--color-neutral-bg);color:var(--color-ink-secondary);border:0.5px solid var(--color-neutral-border)}
.prod-heart{position:absolute;top:7px;right:7px;width:24px;height:24px;background:rgba(250,249,247,.85);display:flex;align-items:center;justify-content:center;border-radius:50%}
.prod-colors{display:flex;gap:4px;align-items:center;margin-bottom:5px}
.color-chip{width:11px;height:11px;border-radius:50%;border:0.5px solid rgba(0,0,0,.08)}
.color-chip.active{outline:1.5px solid var(--color-ink);outline-offset:1.5px}
.color-more{font-size:8px;color:var(--color-ink-tertiary)}
.prod-name{font-size:12px;color:var(--color-ink);line-height:1.55;margin-bottom:4px}
.prod-price-row{display:flex;align-items:baseline;gap:5px;flex-wrap:wrap}
.prod-price{font-size:13px;color:var(--color-ink)}
.prod-price-tax{font-size:9px;color:var(--color-ink-tertiary)}
.prod-price-orig{font-size:10px;color:var(--color-ink-tertiary);text-decoration:line-through}
.prod-price-sale{font-size:13px;font-weight:500;color:var(--color-sale)}

/* 結果なし */
.noresult{padding:48px 28px 20px;text-align:center}
.noresult .ic{color:var(--color-ink-tertiary);margin-bottom:18px}
.noresult .msg{font-size:13px;color:var(--color-ink);line-height:1.7;margin-bottom:6px}
.noresult .msg b{font-weight:500}
.noresult .hint{font-size:10.5px;color:var(--color-ink-muted);line-height:1.7;margin-bottom:26px}
.nr-h{font-family:var(--font-serif-en);font-size:14px;letter-spacing:var(--tracking-eyebrow);color:var(--color-caption);text-align:center;margin:0 0 14px;display:flex;align-items:center;gap:10px;padding:0 28px;text-transform:uppercase}
.nr-h::before,.nr-h::after{content:'';flex:1;height:1px;background:var(--color-hairline-2)}
.chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;padding:0 24px 30px}
.chip{font-size:11px;letter-spacing:.04em;color:var(--color-ink);border:0.5px solid var(--color-hairline-2);padding:8px 16px}
</style>
</head>
<body>

<div class="doc">STYLE DELI — 検索結果ページ v1</div>
<p class="sub">375px / 確定ヘッダー・確定トークン / 結果あり・結果なし(0件)</p>

<div class="row" id="row"></div>

<script>
const burger='<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2"><path d="M4 7h16M4 12h16M4 17h16"/></svg>';
const ic_search='<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.3"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.5-4.5"/></svg>';
const ic_heart='<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2"><path d="M12 20s-7-4.5-7-9.5A3.6 3.6 0 0 1 12 7a3.6 3.6 0 0 1 7 3.5C19 15.5 12 20 12 20z"/></svg>';
const ic_cart='<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2"><path d="M6 8h12l-1 12H7L6 8z"/><path d="M9 8a3 3 0 0 1 6 0"/></svg>';
const heart='<div class="prod-heart"><svg width="12" height="12" viewBox="0 0 12 12" fill="none" stroke="#2a2a2a" stroke-width="1"><path d="M6 10.5s-5-3.2-5-6.5A2.7 2.7 0 0 1 6 2 2.7 2.7 0 0 1 11 4C11 7.3 6 10.5 6 10.5z"/></svg></div>';
const mag='<svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.5-4.5"/></svg>';

const header=`
  <div class="m-anno"><span>新作＆ピックアップ 24時間ポイントアップ開催中</span><span class="cta">詳細 ›</span></div>
  <div class="m-head"><div class="m-burger">${burger}</div><div class="m-logo">STYLE DELI</div><div class="m-head-ic"><div class="m-ic">${ic_search}</div><div class="m-ic">${ic_heart}</div><div class="m-ic">${ic_cart}<span class="badge">2</span></div></div></div>`;

const searchField=(q)=>`<div class="search-ctx"><div class="search-field">${ic_search}<span class="q">${q}</span><span class="clr">×</span></div></div>`;
const toolbar=`<div class="toolbar">
  <div class="toolbar-btn"><svg width="12" height="12" viewBox="0 0 12 12" fill="none" stroke="#2a2a2a" stroke-width="1"><line x1="1" y1="3" x2="11" y2="3"/><line x1="3" y1="6" x2="9" y2="6"/><line x1="5" y1="9" x2="7" y2="9"/></svg>絞り込み</div>
  <div class="toolbar-btn"><svg width="12" height="12" viewBox="0 0 12 12" fill="none" stroke="#2a2a2a" stroke-width="1"><line x1="1" y1="2" x2="11" y2="2"/><line x1="1" y1="5" x2="8" y2="5"/><line x1="1" y1="8" x2="5" y2="8"/></svg>関連度順</div>
  <div class="toolbar-btn"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="#2a2a2a" stroke-width="1.3"><rect x="1" y="1" width="6" height="14"/><rect x="9" y="1" width="6" height="14"/></svg></div>
</div>`;

const prods=[
 {b:[['point','POINT 10x']],c:['#d4cec8','#2a2a2a','#8a9a8a'],more:'+1',n:'プリーツワイドパンツ',p:'<span class="prod-price">¥14,500</span><span class="prod-price-tax">税込</span>'},
 {b:[['sale','SALE']],c:['#c8b4a0','#2a2a2a'],n:'リネンブレンドワイドパンツ',p:'<span class="prod-price-orig">¥12,800</span><span class="prod-price-sale">¥9,600</span>'},
 {b:[['rear','BACK IN STOCK']],c:['#8a9a8a','#d4cec8'],n:'タックワイドパンツ',p:'<span class="prod-price">¥13,200</span><span class="prod-price-tax">税込</span>'},
 {b:[],c:['#2a2a2a'],n:'ストレッチワイドパンツ',p:'<span class="prod-price">¥11,900</span><span class="prod-price-tax">税込</span>'},
 {b:[['pre','予約']],c:['#d4cec8','#8a9a8a','#c8b4a0'],n:'ウールワイドパンツ',p:'<span class="prod-price">¥16,500</span><span class="prod-price-tax">税込</span>'},
 {b:[['point','POINT 10x']],c:['#c8b4a0'],n:'イージーワイドパンツ',p:'<span class="prod-price">¥9,800</span><span class="prod-price-tax">税込</span>'},
];
const cell=(pr)=>`<div><div class="prod-img-wrap"><div class="prod-img-ph">4:5</div>${pr.b.length?`<div class="prod-badges">${pr.b.map(([k,t])=>`<span class="badge badge-${k}">${t}</span>`).join('')}</div>`:''}${heart}</div><div class="prod-colors">${pr.c.map((h,i)=>`<div class="color-chip${i===0?' active':''}" style="background:${h}"></div>`).join('')}${pr.more?`<span class="color-more">${pr.more}</span>`:''}</div><div class="prod-name">${pr.n}</div><div class="prod-price-row">${pr.p}</div></div>`;

const results=`${header}${searchField('ワイドパンツ')}<div class="result-line"><b>「ワイドパンツ」</b>の検索結果</div><div class="result-count">全23点</div>${toolbar}<div class="prods-2">${prods.map(cell).join('')}</div>`;

const noResult=`${header}${searchField('わいどぱんつ メンズ')}
  <div class="noresult">
    <div class="ic">${mag}</div>
    <div class="msg"><b>「わいどぱんつ メンズ」</b>に一致する<br>商品は見つかりませんでした</div>
    <div class="hint">キーワードを変える・短くする、<br>表記をひらがな／カタカナにすると<br>見つかりやすくなります</div>
  </div>
  <div class="nr-h">人気のカテゴリーから探す</div>
  <div class="chips"><span class="chip">ワイドパンツ</span><span class="chip">ワンピース</span><span class="chip">トップス</span><span class="chip">スカート</span><span class="chip">アウター</span><span class="chip">新着アイテム</span></div>`;

document.getElementById('row').innerHTML=`
  <div><div class="col-label">検索結果（あり）</div><div class="phone">${results}</div></div>
  <div><div class="col-label">検索結果（0件）</div><div class="phone">${noResult}</div></div>
`;
</script>

</body>
</html>
