<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1240">
<title>STYLE DELI – デスクトップ 絞り込み画面</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root{
  --font-sans:'Zen Kaku Gothic New', sans-serif;
  --bg:#faf9f7; --ink:#2a2a2a; --ink-soft:#6a6a62; --line:#ece9e4; --line-soft:#f0ede8;
  --ph:#e4dfd8; --muted:#bbb; --muted-2:#aaa;
  --color-point-bg:#faf9f7; --color-point-border:#c8a870; --color-point-strong:#8a6a30;
  --color-sale:#8a3030; --color-sale-line:#c8a0a0;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--font-sans);background:#e8e5e0;padding:32px 24px;display:flex;flex-direction:column;align-items:center;gap:36px;color:var(--ink)}
.doc{font-size:16px;letter-spacing:.1em;color:#777;font-weight:500;text-align:center}
p.sub{font-size:10px;color:#bbb;letter-spacing:.06em;text-align:center}
.frame-label{font-size:11px;font-weight:500;letter-spacing:.12em;color:#555;text-align:center;margin-bottom:10px}
.frame-label small{display:block;font-weight:400;font-size:9px;color:#999;margin-top:3px}
.desktop{width:1120px;max-width:100%;height:620px;background:var(--bg);border:1px solid #c8c4be;border-radius:10px;overflow:hidden;box-shadow:0 8px 32px rgba(0,0,0,.12);position:relative}

/* ── 共通ヘッダー（トップと同一） ── */
.announce{display:flex;align-items:center;justify-content:center;gap:12px;background:var(--ink);color:#efece6;font-size:10px;letter-spacing:.1em;padding:8px 12px}
.announce .adot{opacity:.45}
.announce .alink{color:#efece6;opacity:.85;text-decoration:none;border-bottom:0.5px solid rgba(255,255,255,.4)}
.hdr{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:0 36px;height:68px;border-bottom:1px solid var(--line)}
.hdr-search{display:flex;align-items:center;gap:8px;color:var(--muted-2);font-size:11px;letter-spacing:.04em;border-bottom:0.5px solid #d9d4cc;padding:6px 2px;max-width:190px}
.hdr-logo{font-size:18px;letter-spacing:.42em;font-weight:400;text-align:center}
.hdr-icons{display:flex;gap:18px;justify-self:end}
.hdr-nav{display:flex;justify-content:center;gap:34px;padding:13px 0;border-bottom:1px solid var(--line)}
.hdr-nav a{font-size:11px;letter-spacing:.18em;color:var(--ink);text-decoration:none}

.cat{padding:26px 36px 14px;text-align:center}
.cat .eyebrow{font-size:11px;letter-spacing:.3em;color:var(--muted-2);margin-bottom:10px}
.cat .jp{font-size:20px;font-weight:500;letter-spacing:.2em}
.toolbar{display:flex;align-items:center;justify-content:space-between;padding:0 36px;height:50px;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.tb-left{display:flex;align-items:center;gap:18px}
.tb-btn{display:flex;align-items:center;gap:7px;font-size:11px;letter-spacing:.12em;cursor:pointer}
.tb-count{font-size:11px;color:var(--muted);letter-spacing:.1em}
.tb-sort{font-size:11px;letter-spacing:.12em}

.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:0 22px;padding:22px 36px}
.cell{}
.img{position:relative;width:100%;aspect-ratio:4/5;background:var(--ph);margin-bottom:10px}
.badges{position:absolute;top:9px;left:9px;display:flex;flex-direction:column;gap:4px}
.badge{font-size:8px;letter-spacing:.1em;padding:3px 6px;background:var(--bg)}
.badge-point{color:var(--color-point-strong);border:0.5px solid var(--color-point-border)}
.badge-rear,.badge-pre,.badge-free{color:var(--ink-soft);border:0.5px solid #c8c4b8}
.badge-sale{color:var(--color-sale);border:0.5px solid var(--color-sale-line)}
.chips{display:flex;gap:5px;margin-bottom:7px}
.chip{width:12px;height:12px;border-radius:50%;border:0.5px solid rgba(0,0,0,.08)}
.chip.active{outline:1.5px solid var(--ink);outline-offset:1.5px}
.name{font-size:13px;line-height:1.5;margin-bottom:5px}
.prow{display:flex;align-items:baseline;gap:6px}
.price{font-size:14px}.tax{font-size:10px;color:var(--muted)}
.orig{font-size:11px;color:var(--muted);text-decoration:line-through}.sale{font-size:14px;font-weight:500;color:var(--color-sale)}

/* ── ドロワー ── */
.overlay{position:absolute;inset:0;background:rgba(42,42,42,.34);z-index:20}
.drawer{position:absolute;top:0;right:0;bottom:0;width:400px;background:var(--bg);z-index:21;display:flex;flex-direction:column;box-shadow:-8px 0 30px rgba(0,0,0,.18)}
.dr-head{display:flex;align-items:center;justify-content:space-between;padding:20px 24px 16px;border-bottom:1px solid var(--line)}
.dr-title{font-size:13px;font-weight:500;letter-spacing:.16em}
.dr-x{font-size:20px;color:var(--muted-2);font-weight:300}
.dr-body{flex:1;overflow-y:auto}
.dr-body::-webkit-scrollbar{width:0}
.sec{border-bottom:1px solid var(--line-soft);padding:16px 24px}
.sec-label{font-size:11px;font-weight:500;letter-spacing:.14em;margin-bottom:12px}
.kw{display:flex;flex-wrap:wrap;gap:8px}
.kw span{font-size:10px;letter-spacing:.06em;border:0.5px solid #d6d1c8;padding:6px 12px;background:#fff}
.toggle-row{display:flex;align-items:center;justify-content:space-between}
.toggle-txt{font-size:12px}.toggle-txt small{color:var(--muted-2)}
.switch{width:38px;height:21px;border-radius:11px;background:#dcd7cf;position:relative}
.switch.on{background:var(--ink)}
.switch::after{content:"";position:absolute;top:2px;left:2px;width:17px;height:17px;border-radius:50%;background:#fff}
.switch.on::after{left:19px}
.acc{border-bottom:1px solid var(--line-soft)}
.acc-h{display:flex;align-items:center;justify-content:space-between;padding:15px 24px;cursor:pointer}
.acc-h .t{font-size:11px;font-weight:500;letter-spacing:.14em;display:flex;gap:8px;align-items:baseline}
.acc-h .sel{font-size:10px;color:var(--ink-soft);font-weight:400}
.acc-h .cv{font-size:11px;color:var(--muted-2)}
.acc-b{padding:0 24px 16px}
.ck{display:flex;align-items:center;gap:10px;padding:8px 0}
.ck-box{width:15px;height:15px;border:1px solid #c4bfb6;border-radius:2px;position:relative;flex-shrink:0}
.ck-box.on{background:var(--ink);border-color:var(--ink)}
.ck-box.on::after{content:"";position:absolute;left:4.5px;top:1px;width:4px;height:8px;border:solid #fff;border-width:0 1.5px 1.5px 0;transform:rotate(45deg)}
.ck-l{font-size:12px}.ck-l small{color:var(--muted-2);margin-left:3px}
.swg{display:grid;grid-template-columns:repeat(4,1fr);gap:14px 8px}
.sw{display:flex;flex-direction:column;align-items:center;gap:6px}
.sw-d{width:30px;height:30px;border-radius:50%;border:0.5px solid rgba(0,0,0,.1)}
.sw.active .sw-d{outline:1.5px solid var(--ink);outline-offset:2px}
.sw.dis{opacity:.35}
.sw-n{font-size:9px;color:var(--ink-soft)}
.sw-note{font-size:9px;color:var(--muted-2);margin-top:8px}
.szg{display:flex;flex-wrap:wrap;gap:8px}
.sz{min-width:44px;text-align:center;font-size:11px;border:0.5px solid #d6d1c8;padding:9px 6px}
.sz.active{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.price-row{display:flex;align-items:center;gap:10px}
.price-in{flex:1;border:0.5px solid #d6d1c8;padding:9px 10px;font-size:11px;color:var(--muted-2);background:#fff}
.dr-foot{display:flex;align-items:center;gap:16px;padding:16px 24px;border-top:1px solid var(--line)}
.reset{font-size:11px;color:var(--ink-soft);border-bottom:1px solid #ddd;padding-bottom:1px}
.apply{flex:1;background:var(--ink);color:var(--bg);text-align:center;padding:14px;font-size:12px;letter-spacing:.14em;font-weight:500}
</style>
</head>
<body>

<div class="doc">STYLE DELI — デスクトップ 絞り込み画面</div>
<p class="sub">1120px / 右ドロワー（モバイル共通UI）/ カテゴリ＝フラット・S&D標準スコープ</p>

<div id="root"></div>

<script>
const icon=(p)=>`<svg width="19" height="19" viewBox="0 0 19 19" fill="none" stroke="#2a2a2a" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round">${p}</svg>`;
const colors=[['ホワイト','#f3f1ee'],['グレー','#b8b4ad'],['ブラック','#2a2a2a'],['ブラウン','#6b4f3a'],['ベージュ','#cbb89d'],['グリーン','#7c8a6f'],['ブルー','#5a6b86'],['パープル','#7a6a86'],['イエロー','#d8c87a'],['ピンク','#d8a9aa'],['レッド','#9a3b3b'],['シルバー','#c3c3c3']];
const sizes=['FREE','XS','S','M','L','LL','01','02','03'];
const brands=[['BLK001',18],['marjour',24],['DELI by',12],['DRESSDEN',7]];
const cats=[['トップス',24],['ワンピース',18],['ボトムス',12],['セットアップ',6],['アウター',5],['バッグ・アクセサリー',8]];
const care=[['洗濯機で洗える',38],['手洗い可',18],['ドライクリーニングのみ',6]];
const keywords=['体型カバー','洗える','セットアップ','送料無料','メイドインジャパン','大人カジュアル'];

/* 背面ページ（ヘッダー共通＋グリッド一部） */
const prods=[
 {b:[['point','POINT 10x'],['rear','BACK IN STOCK']],c:['#d4cec8','#2a2a2a','#8a9a8a'],n:'プリーツワイドパンツ',p:'<span class="price">¥14,500</span><span class="tax">税込</span>'},
 {b:[['sale','SALE']],c:['#c8b4a0','#2a2a2a'],n:'リネンオーバーサイズシャツ',p:'<span class="orig">¥12,800</span><span class="sale">¥9,600</span>'},
 {b:[['pre','予約'],['free','送料無料']],c:['#8a9a8a','#d4cec8'],n:'ウールテーラードジャケット',p:'<span class="price">¥22,000</span><span class="tax">税込</span>'},
 {b:[],c:['#2a2a2a'],n:'ドレープワンピース',p:'<span class="price">¥18,900</span><span class="tax">税込</span>'},
];
const cell=(pr)=>`<div class="cell"><div class="img">${pr.b.length?`<div class="badges">${pr.b.map(([k,t])=>`<span class="badge badge-${k}">${t}</span>`).join('')}</div>`:''}</div><div class="chips">${pr.c.map((h,i)=>`<div class="chip${i===0?' active':''}" style="background:${h}"></div>`).join('')}</div><div class="name">${pr.n}</div><div class="prow">${pr.p}</div></div>`;
const header=`
 <div class="announce"><span>新作＆ピックアップ商品　24時間ポイントアップ開催中</span><span class="adot">●</span><span>¥15,000以上で送料無料</span><a class="alink" href="#">詳細 ›</a></div>
 <div class="hdr">
   <div class="hdr-search">${icon('<circle cx="8" cy="8" r="5.2"/><line x1="12" y1="12" x2="17" y2="17"/>')}<span>アイテムを検索</span></div>
   <div class="hdr-logo">STYLE DELI</div>
   <div class="hdr-icons">${icon('<circle cx="9.5" cy="5.5" r="2.6"/><path d="M3.5 16c0-3.3 2.7-5.5 6-5.5s6 2.2 6 5.5"/>')}${icon('<path d="M9.5 16.5S3 12.5 3 8a3.3 3.3 0 0 1 6.5-1A3.3 3.3 0 0 1 16 8c0 4.5-6.5 8.5-6.5 8.5z"/>')}${icon('<path d="M4 4h12l-1.5 9h-9L4 4z"/><circle cx="8" cy="16.5" r="1"/><circle cx="13.5" cy="16.5" r="1"/>')}</div>
 </div>
 <nav class="hdr-nav"><a href="#">NEW</a><a href="#">CATEGORY ∨</a><a href="#">BRAND ∨</a><a href="#">STYLING</a><a href="#">OUTLET</a></nav>`;
const behind=(count)=>`${header}<div class="cat"><div class="eyebrow">NEW ARRIVALS</div><div class="jp">新着アイテム</div></div><div class="toolbar"><div class="tb-left"><div class="tb-btn">${icon('<line x1="2" y1="5" x2="17" y2="5"/><line x1="5" y1="9.5" x2="14" y2="9.5"/><line x1="8" y1="14" x2="11" y2="14"/>')}絞り込み</div><div class="tb-count">全${count}点</div></div><div class="tb-sort">新着順 ∨</div></div><div class="grid">${prods.map(cell).join('')}</div>`;

/* ドロワー（状態で展開/選択を切替） */
function acc(title, sel, open, body){
  return `<div class="acc"><div class="acc-h"><div class="t">${title}${sel?`<span class="sel">${sel}</span>`:''}</div><div class="cv">${open?'∧':'∨'}</div></div>${open?`<div class="acc-b">${body}</div>`:''}</div>`;
}
const ckList=(arr)=>arr.map(([n,c])=>`<div class="ck"><div class="ck-box"></div><div class="ck-l">${n}<small>(${c})</small></div></div>`).join('');
const swGrid=(st)=>`<div class="swg">${colors.map(([n,h])=>{const cls=(st.active||[]).includes(n)?' active':(st.dis||[]).includes(n)?' dis':'';return `<div class="sw${cls}"><div class="sw-d" style="background:${h}"></div><div class="sw-n">${n}</div></div>`;}).join('')}</div>${st.dis&&st.dis.length?`<div class="sw-note">${st.dis[0]}は在庫なし</div>`:''}`;
const szGrid=(a)=>`<div class="szg">${sizes.map(s=>`<div class="sz${a===s?' active':''}">${s}</div>`).join('')}</div>`;
const priceBody=`<div class="price-row"><div class="price-in">¥ min</div><span>〜</span><div class="price-in">¥ max</div></div>`;

function drawer(st){
  return `
  <div class="overlay"></div>
  <div class="drawer">
    <div class="dr-head"><div class="dr-title">絞り込み</div><div class="dr-x">×</div></div>
    <div class="dr-body">
      <div class="sec"><div class="sec-label">人気キーワード</div><div class="kw">${keywords.map(k=>`<span>${k}</span>`).join('')}</div></div>
      <div class="sec"><div class="toggle-row"><div class="toggle-txt">在庫ありのみ表示 <small>(42)</small></div><div class="switch${st.inStock?' on':''}"></div></div></div>
      ${acc('ブランド','',st.open.brand, ckList(brands))}
      ${acc('カテゴリ','',st.open.cat, ckList(cats))}
      ${acc('カラー', st.color||'', st.open.color, swGrid(st.sw||{}))}
      ${acc('サイズ', st.size||'', st.open.size, szGrid(st.size))}
      ${acc('お手入れ','',st.open.care, ckList(care))}
      ${acc('価格（税込）','',st.open.price, priceBody)}
    </div>
    <div class="dr-foot"><div class="reset">リセット</div><div class="apply">${st.count}件を表示</div></div>
  </div>`;
}

const initial={inStock:false,count:61,open:{brand:true,cat:true,color:true,size:true,care:true,price:true},sw:{},size:null,color:null};
const selected={inStock:true,count:14,color:'ブラック',size:'02',open:{brand:false,cat:false,color:true,size:true,care:false,price:false},sw:{active:['ブラック'],dis:['グレー']}};

document.getElementById('root').innerHTML=`
  <div style="display:flex;flex-direction:column;align-items:center;gap:36px">
    <div><div class="frame-label">初期状態（絞り込みなし）<small>全項目展開・S&D標準</small></div><div class="desktop">${behind(61)}${drawer(initial)}</div></div>
    <div><div class="frame-label">選択後（ブラック・02・在庫あり）<small>カラー/サイズ選択・件数14に更新</small></div><div class="desktop">${behind(14)}${drawer(selected)}</div></div>
  </div>`;
</script>

</body>
</html>
